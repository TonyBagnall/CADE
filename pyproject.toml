[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cade"
version = "0.1"
description = "CADE: Context-Aware Differentiable Elastic Alignment"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Christopher Holder" }]
requires-python = ">=3.10"

# The CADE losses need only the deep learning framework you choose, so there are no
# required dependencies. Pick extras:
#   pytorch / jax / tensorflow   one backend (all = every backend)
#   notebook                     notebooks/reproduce_paper.ipynb
#   experiments                  cade/experiments (needs the aeon fork, see below)
#   dev                          experiments + test and lint tools
dependencies = []

[project.optional-dependencies]
pytorch = [
  "numpy",  # torch warns on import without it
  "torch>=2.3",
]
jax = [
  "jax>=0.4.31",
]
tensorflow = [
  "tensorflow>=2.15; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version < '3.13'",
  "tensorflow-macos>=2.15; platform_system == 'Darwin' and platform_machine == 'arm64' and python_version < '3.13'",
]
all = [
  "cade[pytorch,jax,tensorflow]",
]
notebook = [
  "cade[pytorch]",
  "aeon>=1.4,<1.5",
  "jupyter",
  "matplotlib",
  "pandas",
  "seaborn",
]
# The soft MSM distance used by the experiments and tests is only on this aeon fork
# branch (aeon 1.4) for now. The notebook extra is pinned to aeon 1.4 to match.
experiments = [
  "cade[pytorch]",
  "aeon@git+https://github.com/aeon-toolkit/aeon@soft-msm-experiments#egg=aeon",
  "matplotlib",
  "pandas",
  "python-dotenv",
  "scikit-learn",
  "tsml-eval>=0.7",
]
dev = [
  "cade[all,experiments]",
  "black",
  "flake8",
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-timeout",
  "pytest-xdist",
]

[tool.setuptools.packages.find]
include = ["cade*"]

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D100", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.flake8]
per-file-ignores = [
    "cade/jax/tests/test_*.py:E402",
]

[tool.pytest.ini_options]
testpaths = [
    "cade"
]
addopts = '''
    --doctest-modules
    --durations 20
    --timeout 600
    --showlocals
    --dist worksteal
    --reruns 2
    --only-rerun "crashed while running"
    -v
'''
filterwarnings = '''
    ignore::UserWarning
    ignore:numpy.dtype size changed
    ignore:numpy.ufunc size changed
'''
